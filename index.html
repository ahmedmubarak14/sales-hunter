<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sales Hunter — Zid employee referral program</title>
  <!-- Runs before first paint to avoid a flash of the wrong theme, so it
       must stay synchronous and ahead of the stylesheet. In its own file
       (not inline) so the CSP can forbid inline scripts entirely. -->
  <script src="theme-boot.js?v=20260901a"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- ?v= is a cache buster. This project has no build step, so the asset
       filenames never change and a browser will happily keep serving a
       stale app.js after a deploy. Bump the number on every release that
       touches a .js or .css file. -->
  <link rel="stylesheet" href="styles.css?v=20260901a">
</head>
<body>
  <div id="app"></div>
  <script src="config.js?v=20260901a"></script>
  <script src="data.js?v=20260901a"></script>
  <script src="i18n.js?v=20260901a"></script>
  <script src="api.js?v=20260901a"></script>
  <script src="charts.js?v=20260901a"></script>
  <script src="daterange.js?v=20260901a"></script>
  <script src="app.js?v=20260901a"></script>
</body>
</html>
